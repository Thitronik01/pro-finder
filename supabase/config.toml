# Supabase-CLI-Konfiguration (v2) für den THITRONIK Pro-finder Barrierefreiheits-Pilot.
# Minimal gehalten – nicht gesetzte Werte übernimmt die CLI aus ihren Defaults.

project_id = "pro-finder-pilot"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
# Größtes Quelldokument (DOC-IBA-SN045) ist ~10 MB – 50 MiB lässt Reserve.
file_size_limit = "50MiB"

[analytics]
enabled = false
