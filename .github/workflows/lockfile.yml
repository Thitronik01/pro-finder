name: Lockfile

# Voruebergehender Hilfsworkflow.
#
# package-lock.json wird auf einer Windows-Arbeitsstation gepflegt. npm
# beschneidet dabei optionale Zweige, die es lokal nicht installiert, sodass
# das Lockfile fuer Linux unvollstaendig sein kann - `npm ci` laeuft unter
# Windows sauber durch und bricht in CI ab. Unter Windows laesst sich das
# nicht zuverlaessig beheben; npm pendelt zwischen unvollstaendigen
# Zustaenden.
#
# Dieser Workflow erzeugt das Lockfile auf derselben Plattform, auf der es
# gelten muss, beweist mit einem echten `npm ci`, dass es traegt, und
# committet es zurueck. Der Push nutzt GITHUB_TOKEN und loest deshalb keinen
# weiteren Workflowlauf aus - eine Schleife ist ausgeschlossen.
#
# Nach dem Merge wieder entfernen; die dauerhafte Absicherung ist
# scripts/check-lockfile.mjs in `npm run check`.

on:
  push:
    branches: ['bootstrap/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Lockfile unter Linux erzeugen und pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Lockfile neu aufloesen
        run: npm install --package-lock-only

      - name: Aenderung feststellen
        id: diff
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'Lockfile war bereits vollstaendig.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo '### Lockfile unter Linux ergaenzt'
              echo ''
              echo '```diff'
              git diff --stat -- package-lock.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Der eigentliche Beweis: nur was `npm ci` hier akzeptiert, taugt fuer CI.
      - name: Mit npm ci verifizieren
        run: npm ci

      - name: Ergebnis zuruecktragen
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(lockfile): unter Linux vollstaendig aufgeloest'
          git push
