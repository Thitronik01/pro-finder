    />
    <text x="42.8" y="38.1" fill="#1a1a1a" font-size="2.25" font-weight="700" text-anchor="middle">
      BRAILLE-FLÄCHE · PLATZHALTER
    </text>

    <text x="4" y="44.7" fill="#102a4c" font-size="2.65" font-weight="700">THITRONIK SUPPORT</text>
    <text x="4" y="48.4" fill="#1a1a1a" font-size="2.25" font-weight="700">Telefon: [TELEFON OFFEN]</text>
    <text x="46" y="48.4" fill="#1a1a1a" font-size="2.25" font-weight="700">E-Mail: [E-MAIL OFFEN]</text>
